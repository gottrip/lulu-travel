<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Element TD 終極超越強化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
        #map { cursor: crosshair; }
        .path { pointer-events: none; }
        .enemy { pointer-events: none; }
        .projectile { pointer-events: none; }
    </style>
</head>
<body class="flex justify-center items-start pt-3 px-2 min-h-screen pb-10">

<!-- 縱向主容器 -->
<div id="game-container" class="relative w-full max-w-[410px] min-h-[980px] bg-slate-900 border-2 border-slate-700/60 rounded-3xl shadow-2xl p-4 flex flex-col justify-between">
    
    <!-- 1. 頂部：音效 + 倍速控制 + 數據欄 -->
    <div class="w-full flex flex-col gap-2">
        <div class="grid grid-cols-4 gap-1.5">
            <button id="bgm-btn" onclick="toggleBGM()" class="py-1.5 rounded-lg font-bold text-[11px] bg-slate-800 text-slate-400 border border-slate-700">🎵 音樂:關</button>
            <button id="sfx-btn" onclick="toggleSFX()" class="py-1.5 rounded-lg font-bold text-[11px] bg-indigo-600 text-white border border-indigo-500">💥 音效:開</button>
            <button id="pause-btn" onclick="togglePause()" class="py-1.5 rounded-lg font-bold text-[11px] bg-amber-600 text-white border border-amber-500">⏸️ 暫停</button>
            <button id="speed-btn" onclick="toggleSpeed()" class="py-1.5 rounded-lg font-bold text-[11px] bg-sky-600 text-white border border-sky-500">⚡ 1x 倍速</button>
        </div>
        
        <!-- 數據面板 -->
        <div class="grid grid-cols-4 gap-1.5 bg-slate-950/60 p-2 rounded-xl border border-slate-800 text-center">
            <div>
                <div class="text-[10px] text-slate-400 font-medium mb-0.5">波次</div>
                <div id="ui-wave" class="text-base font-black text-sky-400">0</div>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-medium mb-0.5">下波預告</div>
                <div id="ui-next-preview" class="inline-block px-1 py-0.5 text-[10px] font-bold rounded border bg-slate-900 border-slate-700 text-slate-400">載入中</div>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-medium mb-0.5">金幣 (5%利息)</div>
                <div id="ui-gold" class="text-base font-black text-amber-400">$200</div>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-medium mb-0.5">生命</div>
                <div id="ui-hp" class="text-lg font-black text-rose-500">20</div>
            </div>
        </div>
    </div>

    <!-- 2. 全螢幕玩家主動技能欄 -->
    <div class="grid grid-cols-3 gap-1.5 my-1">
        <button id="skill-1" onclick="useSkill('meteor')" class="py-1.5 bg-gradient-to-r from-rose-700 to-red-600 hover:from-rose-600 hover:to-red-500 text-white font-black text-[10px] rounded-xl border border-rose-400 shadow-md">
            🔥 毀滅天火<br><span id="cd-1" class="text-[9px] font-normal text-rose-200">全圖扣30%血</span>
        </button>
        <button id="skill-2" onclick="useSkill('freeze')" class="py-1.5 bg-gradient-to-r from-cyan-700 to-blue-600 hover:from-cyan-600 hover:to-blue-500 text-white font-black text-[10px] rounded-xl border border-cyan-400 shadow-md">
            ❄️ 全圖冰封<br><span id="cd-2" class="text-[9px] font-normal text-cyan-200">定身 4 秒</span>
        </button>
        <button id="skill-3" onclick="useSkill('overload')" class="py-1.5 bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-slate-950 font-black text-[10px] rounded-xl border border-amber-300 shadow-md">
            ⚡ 狂暴過載<br><span id="cd-3" class="text-[9px] font-normal text-slate-900">雙倍攻速6秒</span>
        </button>
    </div>

    <!-- 3. 地圖區 (長形 440px 高度) -->
    <div class="w-full my-1">
        <div id="map" onclick="handleMapClick(event)" class="relative w-[378px] h-[440px] bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden shadow-inner mx-auto">
            <div id="range-indicator" class="absolute hidden border-2 border-dashed rounded-full pointer-events-none transform -translate-x-1/2 -translate-y-1/2 z-30 opacity-40 bg-white/5 transition-all"></div>
            <!-- 技能特效透明遮罩 -->
            <div id="skill-overlay" class="absolute inset-0 pointer-events-none z-40 transition-all opacity-0"></div>
        </div>
    </div>

    <!-- 4. 中間選單區 (絕不重疊) -->
    <div class="w-full h-[155px] flex items-center justify-center bg-slate-950/70 border border-slate-800 rounded-2xl p-2.5 my-1">
        <div id="menu-idle-text" class="text-center text-slate-500 text-xs py-4 px-2 leading-relaxed">
            💡 點擊地圖空地自由建造 ($50)<br>三階神塔可進行【🌟星級超越強化】與【免費換屬性】
        </div>

        <!-- 建造選單 -->
        <div id="build-menu" class="hidden w-full flex flex-col gap-1.5">
            <div class="text-center text-xs font-bold text-slate-300">在此處建造基礎元素塔 (花費 $50)</div>
            <div class="grid grid-cols-3 gap-1.5">
                <button class="py-2 px-1 text-xs font-black rounded-xl bg-rose-600 hover:bg-rose-500 text-white shadow" onclick="buildTower('fire')">火之塔<br><span class="text-[9px] font-normal text-rose-200">(剋草/弱水)</span></button>
                <button class="py-2 px-1 text-xs font-black rounded-xl bg-sky-600 hover:bg-sky-500 text-white shadow" onclick="buildTower('water')">水之塔<br><span class="text-[9px] font-normal text-sky-200">(剋火/弱草)</span></button>
                <button class="py-2 px-1 text-xs font-black rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 shadow" onclick="buildTower('nature')">草之塔<br><span class="text-[9px] font-normal text-emerald-900">(剋水/弱火)</span></button>
            </div>
            <button class="w-full py-1 text-xs font-bold text-slate-400 bg-slate-800 rounded-lg" onclick="closeMenus()">取消建造</button>
        </div>

        <!-- 升級/拆除/切換/超越選單 -->
        <div id="upgrade-menu" class="hidden w-full flex flex-col gap-1.5">
            <div id="upgrade-title" class="text-center text-xs font-bold text-slate-300">防禦塔配置</div>
            <div class="grid grid-cols-2 gap-1.5" id="upgrade-options-grid">
                <button id="up-btn-1" class="py-1.5 px-1 text-xs font-bold rounded-lg text-white shadow"></button>
                <button id="up-btn-2" class="py-1.5 px-1 text-xs font-bold rounded-lg text-white shadow"></button>
            </div>
            <!-- 一鍵滿級 / 星級超越按鈕列 -->
            <div id="special-action-row" class="hidden">
                <button id="btn-special" class="w-full py-1.5 text-xs font-black rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-md transition-all"></button>
            </div>
            <div class="grid grid-cols-2 gap-1.5">
                <button class="py-1 text-xs font-bold bg-amber-700/80 hover:bg-amber-600 text-white rounded-lg" onclick="sellTower()">拆除 (退$30)</button>
                <button class="py-1 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg" onclick="closeMenus()">返回戰場</button>
            </div>
        </div>
    </div>

    <!-- 5. 底部出怪按鈕 -->
    <div class="w-full pt-1.5 border-t border-slate-800/80 flex flex-col gap-1">
        <button id="start-btn" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-black text-base rounded-2xl shadow-xl transition-all flex justify-center items-center gap-2" onclick="manualStartNextWave()">
            🚀 開始下一波 (支援連按疊加)
        </button>
    </div>

    <!-- 浮動 Toast 通知容器 -->
    <div id="toast-container" class="absolute top-28 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>
</div>

<script>
// --- 遊戲核心數值與狀態 ---
const game = {
    gold: 200, hp: 20, currentWave: 0,
    towerCost: 50, upgrade2Cost: 100, upgrade3Cost: 200,
    nextElement: 'fire',
    autoNextTimer: null, countdownSeconds: 0,
    isPaused: false, gameSpeed: 1,
    skillsCD: { meteor: 0, freeze: 0, overload: 0 },
    overloadTimer: 0
};

// 跑道點陣 (填補缺角特化)
const pathPoints = [
    {x: 20, y: 35}, {x: 330, y: 35}, {x: 330, y: 130},
    {x: 48, y: 130}, {x: 48, y: 225}, {x: 330, y: 225},
    {x: 330, y: 320}, {x: 48, y: 320}, {x: 48, y: 410}, {x: 358, y: 410}
];

let enemies = []; let towers = []; let projectiles = [];
let clickX = 0; let clickY = 0; let selectedTowerId = null;
let gameInterval = null;

// --- Web Audio 音效引擎 ---
let audioCtx = null; let bgmInterval = null; let isBgmOn = false; let isSfxOn = true; let bgmStep = 0;
const bgmNotes = [110, 130, 146, 165, 110, 130, 196, 165];

function initAudio() {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); startBGM(); }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function toggleBGM() {
    initAudio(); isBgmOn = !isBgmOn;
    const btn = document.getElementById('bgm-btn');
    btn.innerText = isBgmOn ? "🎵 音樂:開" : "🎵 音樂:關";
    btn.className = isBgmOn ? "py-1.5 rounded-lg font-bold text-[11px] bg-indigo-600 text-white border border-indigo-500" : "py-1.5 rounded-lg font-bold text-[11px] bg-slate-800 text-slate-400 border border-slate-700";
}

function toggleSFX() {
    initAudio(); isSfxOn = !isSfxOn;
    const btn = document.getElementById('sfx-btn');
    btn.innerText = isSfxOn ? "💥 音效:開" : "💥 音效:關";
    btn.className = isSfxOn ? "py-1.5 rounded-lg font-bold text-[11px] bg-indigo-600 text-white border border-indigo-500" : "py-1.5 rounded-lg font-bold text-[11px] bg-slate-800 text-slate-400 border border-slate-700";
}

function togglePause() {
    game.isPaused = !game.isPaused;
    const btn = document.getElementById('pause-btn');
    btn.innerText = game.isPaused ? "▶️ 繼續" : "⏸️ 暫停";
    btn.className = game.isPaused ? "py-1.5 rounded-lg font-bold text-[11px] bg-rose-600 text-white border border-rose-500 animate-pulse" : "py-1.5 rounded-lg font-bold text-[11px] bg-amber-600 text-white border border-amber-500";
    triggerToast(game.isPaused ? "⏸️ 戰場已暫停，安心建造吧！" : "▶️ 戰場繼續運行", "info");
}

function toggleSpeed() {
    game.gameSpeed = game.gameSpeed === 1 ? 2 : 1;
    const btn = document.getElementById('speed-btn');
    btn.innerText = game.gameSpeed === 2 ? "⚡ 2x 倍速" : "⚡ 1x 倍速";
    btn.className = game.gameSpeed === 2 ? "py-1.5 rounded-lg font-bold text-[11px] bg-emerald-600 text-white border border-emerald-400 shadow-md" : "py-1.5 rounded-lg font-bold text-[11px] bg-sky-600 text-white border border-sky-500";
}

function startBGM() {
    bgmInterval = setInterval(() => {
        if (!isBgmOn || !audioCtx || game.isPaused) return;
        try {
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(bgmNotes[bgmStep % bgmNotes.length], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4); bgmStep++;
        } catch(e) {}
    }, 450);
}

function playShootSound(type) {
    if (!isSfxOn || !audioCtx) return;
    try {
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        if (['fire','wildfire','ultfire'].includes(type)) {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(380, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        } else if (['water','steam','ultwater'].includes(type)) {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.12); gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        } else {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        }
        if (type.startsWith('ult')) gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } catch(e) {}
}

// --- 碰撞判定與 Toast ---
function pointToLineDistance(x, y, x1, y1, x2, y2) {
    const A = x - x1; const B = y - y1; const C = x2 - x1; const D = y2 - y1;
    const dot = A * C + B * D; const len_sq = C * C + D * D;
    let param = -1; if (len_sq !== 0) param = dot / len_sq;
    let xx, yy;
    if (param < 0) { xx = x1; yy = y1; }
    else if (param > 1) { xx = x2; yy = y2; }
    else { xx = x1 + param * C; yy = y1 + param * D; }
    const dx = x - xx; const dy = y - yy; return Math.sqrt(dx * dx + dy * dy);
}

function checkOnPath(x, y) {
    for (let i = 0; i < pathPoints.length - 1; i++) {
        const p1 = pathPoints[i]; const p2 = pathPoints[i+1];
        if (pointToLineDistance(x, y, p1.x, p1.y, p2.x, p2.y) < 20) return true;
    }
    return false;
}

function triggerToast(text, type = "error") {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg transition-all transform translate-y-2 opacity-0 duration-200 scale-95 ` + 
                    (type === "error" ? "bg-rose-600/95" : type === "info" ? "bg-indigo-600/95" : "bg-amber-500/95");
    toast.innerText = text; container.appendChild(toast);
    setTimeout(() => { toast.classList.remove('opacity-0', 'translate-y-2', 'scale-95'); }, 10);
    setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-8px]', 'scale-90');
        setTimeout(() => { toast.remove(); }, 200);
    }, 1800);
}

// 地圖初始化 (無缺角畫法)
function initGame() {
    const mapEl = document.getElementById('map');
    mapEl.innerHTML = '<div id="range-indicator" class="absolute hidden border-2 border-dashed rounded-full pointer-events-none transform -translate-x-1/2 -translate-y-1/2 z-30 opacity-40 bg-white/5 transition-all"></div><div id="skill-overlay" class="absolute inset-0 pointer-events-none z-40 transition-all opacity-0"></div>';

    const ROAD_WIDTH = 16; const HALF_ROAD = ROAD_WIDTH / 2;

    for(let i=0; i<pathPoints.length-1; i++) {
        const p1 = pathPoints[i]; const p2 = pathPoints[i+1];
        const pathLine = document.createElement('div');
        pathLine.className = 'path absolute bg-slate-800 border border-slate-700/50 z-0';
        const minX = Math.min(p1.x, p2.x); const minY = Math.min(p1.y, p2.y);
        const width = Math.abs(p1.x - p2.x); const height = Math.abs(p1.y - p2.y);
        pathLine.style.left = (minX - HALF_ROAD) + 'px'; pathLine.style.top = (minY - HALF_ROAD) + 'px';
        pathLine.style.width = (width > 0 ? width + ROAD_WIDTH : ROAD_WIDTH) + 'px';
        pathLine.style.height = (height > 0 ? height + ROAD_WIDTH : ROAD_WIDTH) + 'px';
        mapEl.appendChild(pathLine);
    }

    pathPoints.forEach(p => {
        const cap = document.createElement('div');
        cap.className = 'path absolute bg-slate-800 border border-slate-700/50 z-0';
        cap.style.left = (p.x - HALF_ROAD) + 'px'; cap.style.top = (p.y - HALF_ROAD) + 'px';
        cap.style.width = ROAD_WIDTH + 'px'; cap.style.height = ROAD_WIDTH + 'px';
        mapEl.appendChild(cap);
    });

    rollNextPreview(); updateUI();
    gameInterval = setInterval(gameLoop, 30);
}

function updateUI() {
    document.getElementById('ui-gold').innerText = `$${game.gold}`;
    document.getElementById('ui-hp').innerText = game.hp;
    document.getElementById('ui-wave').innerText = `${game.currentWave} (無盡)`;
    if (game.hp <= 0) {
        alert(`遊戲結束！您成功防守了 ${game.currentWave} 波攻勢！`);
        clearInterval(gameInterval); clearInterval(bgmInterval); clearInterval(game.autoNextTimer);
        location.reload();
    }
}

function rollNextPreview() {
    const elms = ['fire', 'water', 'nature'];
    game.nextElement = elms[Math.floor(Math.random() * elms.length)];
    const previewEl = document.getElementById('ui-next-preview');
    const isNextBoss = (game.currentWave + 1) % 10 === 0;

    if(game.nextElement === 'fire') {
        previewEl.innerText = isNextBoss ? "👑 10波大Boss(火)" : "🔥 火元素";
        previewEl.className = "inline-block px-1 py-0.5 text-[10px] font-bold rounded border bg-rose-950/40 border-rose-800 text-rose-400";
    } else if(game.nextElement === 'water') {
        previewEl.innerText = isNextBoss ? "👑 10波大Boss(水)" : "💧 水元素";
        previewEl.className = "inline-block px-1 py-0.5 text-[10px] font-bold rounded border bg-sky-950/40 border-sky-800 text-sky-400";
    } else {
        previewEl.innerText = isNextBoss ? "👑 10波大Boss(草)" : "🍃 草元素";
        previewEl.className = "inline-block px-1 py-0.5 text-[10px] font-bold rounded border bg-emerald-950/40 border-emerald-800 text-emerald-400";
    }
}

// --- 點擊與選單邏輯 ---
function handleMapClick(e) {
    initAudio();
    if (e.target.classList.contains('tower-node')) {
        selectedTowerId = parseInt(e.target.dataset.id);
        const tower = towers.find(t => t.id === selectedTowerId);
        setupUpgradeMenu(tower);
        showRangeCircle(tower.x, tower.y, tower.range, tower.type);
        e.stopPropagation(); return;
    }
    
    const rect = document.getElementById('map').getBoundingClientRect();
    const x = e.clientX - rect.left; const y = e.clientY - rect.top;

    if (checkOnPath(x, y)) { triggerToast("❌ 不允許建造在道路上！", "error"); closeMenus(); return; }
    if (towers.some(t => Math.sqrt((t.x - x)**2 + (t.y - y)**2) < 24)) { closeMenus(); return; }

    clickX = x; clickY = y;
    document.getElementById('menu-idle-text').classList.add('hidden');
    document.getElementById('upgrade-menu').classList.add('hidden');
    document.getElementById('build-menu').classList.remove('hidden');
    showRangeCircle(x, y, 85, 'default');
}

function closeMenus() {
    document.getElementById('build-menu').classList.add('hidden');
    document.getElementById('upgrade-menu').classList.add('hidden');
    document.getElementById('menu-idle-text').classList.remove('hidden');
    document.getElementById('range-indicator').classList.add('hidden');
}

function showRangeCircle(x, y, range, type) {
    const indicator = document.getElementById('range-indicator');
    indicator.style.left = x + 'px'; indicator.style.top = y + 'px';
    indicator.style.width = (range * 2) + 'px'; indicator.style.height = (range * 2) + 'px';
    let color = "rgba(255,255,255,0.4)";
    if (['fire','wildfire','ultfire'].includes(type)) color = "rgba(239,68,68,0.5)";
    if (['water','steam','ultwater'].includes(type)) color = "rgba(14,165,233,0.5)";
    if (['nature','ice','ultnature'].includes(type)) color = "rgba(16,185,129,0.5)";
    indicator.style.borderColor = color;
    indicator.classList.remove('hidden');
}

function buildTower(type) {
    if (game.gold < game.towerCost) { triggerToast("🪙 金幣不足 $50！", "error"); closeMenus(); return; }
    game.gold -= game.towerCost;
    const id = Date.now();
    const mapEl = document.getElementById('map');
    const tEl = document.createElement('div');
    tEl.className = `tower-node absolute w-7 h-7 rounded-lg flex items-center justify-center text-[9px] font-black border z-20 transform -translate-x-1/2 -translate-y-1/2 shadow-md ` + 
                    (type === 'fire' ? 'bg-rose-600 border-rose-400 text-white' : type === 'water' ? 'bg-sky-600 border-sky-400 text-white' : 'bg-emerald-500 border-emerald-300 text-slate-950');
    tEl.dataset.id = id;
    tEl.style.left = clickX + 'px'; tEl.style.top = clickY + 'px';
    tEl.innerText = type === 'fire' ? '火一' : type === 'water' ? '水一' : '草一';
    mapEl.appendChild(tEl);

    towers.push({
        id: id, el: tEl, type: type, x: clickX, y: clickY,
        damage: 22, baseDamage: 22, star: 0, range: 85, lastShot: 0, cooldown: 350, isSplash: false
    });
    closeMenus(); updateUI();
}

// 升級 / 一鍵滿級 / 星級超越選單配置
function setupUpgradeMenu(tower) {
    document.getElementById('menu-idle-text').classList.add('hidden');
    document.getElementById('build-menu').classList.add('hidden');
    
    const menu = document.getElementById('upgrade-menu');
    const title = document.getElementById('upgrade-title');
    const b1 = document.getElementById('up-btn-1'); const b2 = document.getElementById('up-btn-2');
    const specRow = document.getElementById('special-action-row');
    const btnSpec = document.getElementById('btn-special');
    
    b1.style.display = "none"; b2.style.display = "none"; specRow.classList.add('hidden');

                                    (currentWaveElement === 'fire' ? 'bg-rose-500' : currentWaveElement === 'water' ? 'bg-sky-400' : 'bg-emerald-400');

            } else {

                                    (currentWaveElement === 'fire' ? 'bg-rose-500 border-rose-300' : currentWaveElement === 'water' ? 'bg-sky-400 border-sky-200' : 'bg-emerald-400 border-emerald-200');

            hpBarBg.className = (isBig10Boss ? 'absolute -top-3 left-1/2 transform -translate-x-1/2 w-10 h-1.5' : 'absolute -top-2 left-1/2 transform -translate-x-1/2 w-6 h-1') + ' bg-slate-950 border border-slate-700 rounded overflow-hidden pointer-events-none';

function getDamageMultiplier(towerType, enemyElement) {
    if (['fire', 'wildfire', 'ultfire'].includes(towerType) && enemyElement === 'nature') return 2.0;
    if (['water', 'steam', 'ultwater'].includes(towerType) && enemyElement === 'fire') return 2.0;
    if (['nature', 'ice', 'ultnature'].includes(towerType) && enemyElement === 'water') return 2.0;
    
    if (['nature', 'ice', 'ultnature'].includes(towerType) && enemyElement === 'fire') return 0.5;
    if (['water', 'steam', 'ultwater'].includes(towerType) && enemyElement === 'nature') return 0.5;
    if (['fire', 'wildfire', 'ultfire'].includes(towerType) && enemyElement === 'water') return 0.5;
    return 1.0;
}

// --- 戰場大循環 (支援 1x/2x 倍速與暫停) ---
function gameLoop() {
    if (game.isPaused) return;

    // 根據倍速重複執行邏輯
    const loops = game.gameSpeed;
    for(let l = 0; l < loops; l++) {
        const now = Date.now();

        if (game.overloadTimer > 0) game.overloadTimer--;

        // 1. 怪物前進
        for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i]; const targetPoint = pathPoints[enemy.pathIndex + 1];
            if (!targetPoint) { game.hp--; enemy.el.remove(); enemies.splice(i, 1); updateUI(); checkWaveEnd(); continue; }
            
            const dx = targetPoint.x - enemy.x; const dy = targetPoint.y - enemy.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            let currentSpeed = enemy.speed;
            
            if (enemy.rootedTimer > 0) {
                enemy.rootedTimer--; currentSpeed = 0; enemy.el.style.borderColor = '#10b981';
            } else {
                enemy.el.style.borderColor = enemy.element === 'fire' ? '#fca5a5' : enemy.element === 'water' ? '#bae6fd' : '#a7f3d0';
                const hasUltWater = towers.some(t => t.type === 'ultwater' && Math.sqrt((enemy.x-t.x)**2 + (enemy.y-t.y)**2) <= t.range);
                const nearIce = towers.some(t => t.type === 'ice' && Math.sqrt((enemy.x-t.x)**2 + (enemy.y-t.y)**2) <= t.range);
                if (hasUltWater) currentSpeed *= 0.3;
                else if (nearIce) currentSpeed *= 0.45;
            }

            if (distance <= currentSpeed) {
                enemy.x = targetPoint.x; enemy.y = targetPoint.y; enemy.pathIndex++;
            } else {
                enemy.x += (dx / distance) * currentSpeed; enemy.y += (dy / distance) * currentSpeed;
            }
            enemy.el.style.left = enemy.x + 'px'; enemy.el.style.top = enemy.y + 'px';
        }

        // 2. 防禦塔開火 (狂暴過載冷卻減半)
        towers.forEach(tower => {
            const effectiveCD = game.overloadTimer > 0 ? tower.cooldown / 2 : tower.cooldown;
            if (now - tower.lastShot < effectiveCD) return;
            
            const targets = enemies.filter(enemy => Math.sqrt((enemy.x - tower.x)**2 + (enemy.y - tower.y)**2) <= tower.range);
            if (targets.length > 0) {
                const target = targets[0];
                playShootSound(tower.type);
                
                const mapEl = document.getElementById('map');
                const pEl = document.createElement('div');
                pEl.className = 'projectile absolute w-2 h-2 rounded-full z-40 shadow-glow ';
                
                if(['fire','wildfire','ultfire'].includes(tower.type)) pEl.classList.add('bg-rose-500', 'shadow-rose-500');
                else if(['water','steam','ultwater'].includes(tower.type)) pEl.classList.add('bg-sky-400', 'shadow-sky-400');
                else pEl.classList.add('bg-emerald-400', 'shadow-emerald-400');
                
                pEl.style.left = tower.x + 'px'; pEl.style.top = tower.y + 'px';
                mapEl.appendChild(pEl);
                
                projectiles.push({ el: pEl, x: tower.x, y: tower.y, target: target, tower: tower, speed: 16 });
                tower.lastShot = now;
            }
        });

        // 3. 子彈移動與命中判定
        for (let i = projectiles.length - 1; i >= 0; i--) {
            const p = projectiles[i];
            if (!enemies.includes(p.target)) { p.el.remove(); projectiles.splice(i, 1); continue; }
            
            const dx = p.target.x - p.x; const dy = p.target.y - p.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance <= p.speed) {
                const mult = getDamageMultiplier(p.tower.type, p.target.element);
                const dmg = p.tower.damage * mult;
                
                if (p.tower.type === 'ultnature') {
                    p.target.rootedTimer = Math.min(p.target.rootedTimer + 25, 30);
                }

                if (p.tower.isSplash) {
                    const splashRadius = p.tower.type === 'ultfire' ? 75 : 45;
                    enemies.forEach(e => {
                        if (Math.sqrt((e.x - p.target.x)**2 + (e.y - p.target.y)**2) <= splashRadius) {
                            e.hp -= dmg; updateEnemyHpBar(e);
                            e.el.style.filter = 'brightness(2.2)';
                            setTimeout(() => { if(e.el) e.el.style.filter = 'none'; }, 40);
                        }
                    });
                } else {
                    p.target.hp -= dmg; updateEnemyHpBar(p.target);
                    p.target.el.style.filter = 'brightness(1.8)';
                    setTimeout(() => { if(p.target.el) p.target.el.style.filter = 'none'; }, 40);
                }
                p.el.remove(); projectiles.splice(i, 1);
            } else {
                p.x += (dx / distance) * p.speed; p.y += (dy / distance) * p.speed;
                p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px';
            }
        }

        // 4. 清理死怪
        for (let i = enemies.length - 1; i >= 0; i--) {
            if (enemies[i].hp <= 0) {
                game.gold += enemies[i].goldReward;
                enemies[i].el.remove(); enemies.splice(i, 1); updateUI();
                checkWaveEnd();
            }
        }
    }
}

function checkWaveEnd() {
    if (enemies.length === 0 && game.currentWave > 0 && !game.autoNextTimer) {
        start10sCountdown();
    }
}

function updateEnemyHpBar(enemy) {
    const pct = Math.max(0, enemy.hp / enemy.maxHp);
    enemy.hpBar.style.width = (pct * 100) + '%';
    if(pct > 0.5) enemy.hpBar.className = 'h-full bg-emerald-500 transition-all';
    else if(pct > 0.2) enemy.hpBar.className = 'h-full bg-amber-400 transition-all';
    else enemy.hpBar.className = 'h-full bg-rose-500 transition-all';
}

window.onload = initGame;
</script>
